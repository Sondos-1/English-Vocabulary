<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاموس كلمات الإنجليزي – من الخامس للتوجيهي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7f0; --paper:#ffffff; --ink:#1f2a37; --muted:#6b7280; --line:#ece4d6;
  --accent:#0f766e; --accent-2:#f59e0b; --accent-soft:#e6f4f1; --chip:#f3ede2;
  --shadow:0 1px 2px rgba(31,42,55,.06),0 6px 20px rgba(31,42,55,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:16px;line-height:1.55}
.en{font-family:Nunito,system-ui,sans-serif;direction:ltr;unicode-bidi:isolate}
header{background:linear-gradient(135deg,#0f766e 0%,#115e59 60%,#134e4a 100%);color:#fff;padding:28px 20px 70px;position:relative;overflow:hidden}
header::after{content:"ABC أ ب ت";position:absolute;left:-10px;bottom:-30px;font:800 120px/1 Nunito,sans-serif;opacity:.07;white-space:nowrap;letter-spacing:6px}
.wrap{max-width:1180px;margin:0 auto}
h1{margin:0 0 6px;font-size:clamp(24px,4vw,36px);font-weight:800}
header p{margin:0;opacity:.88;max-width:720px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:999px;font-size:14px}
.stat b{font-family:Nunito;font-size:16px}
.panel{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin:-48px auto 18px;position:relative;z-index:2;max-width:1180px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 280px;position:relative}
.search input{width:100%;padding:12px 44px 12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fffdf9;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search span{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.5}
select{padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fffdf9}
.seg{display:inline-flex;background:var(--chip);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font:inherit;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{border:1.5px solid var(--line);background:#fffdf9;padding:6px 11px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px;color:var(--ink);transition:.15s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip small{opacity:.7;font-family:Nunito;margin-inline-start:4px}
.result{color:var(--muted);font-size:14px;margin:4px 4px 10px}
main{max-width:1180px;margin:0 auto;padding:0 12px 60px}
/* table */
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--paper);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
th{background:#f7f1e6;text-align:right;font-size:13px;color:var(--muted);font-weight:700;padding:10px 12px;position:sticky;top:0;z-index:1}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#fffaf0}
.emo{font-size:30px;width:56px;text-align:center}
.word{font-weight:800;font-size:18px}
.ipa{color:var(--muted);font-size:13px}
.pos{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.ar{font-weight:500}
.ex{font-size:14px;color:#374151;text-align:left}
.ex mark{background:#fde68a;border-radius:4px;padding:0 2px}
.gr{font-size:12px;color:var(--muted);white-space:nowrap}
.say{border:0;background:var(--chip);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;flex:none}
.say:hover{background:#fde68a}
.wcell{display:flex;align-items:center;gap:8px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--accent-2)}
.card .emo{font-size:46px;width:auto;text-align:center;line-height:1.2}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .word{font-size:21px;text-align:center}
.card .ar{text-align:center;font-size:17px}
.card .ex{border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
/* flash */
.flash{max-width:520px;margin:10px auto;text-align:center}
.fc{background:var(--paper);border-radius:22px;box-shadow:var(--shadow);min-height:330px;padding:28px;display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:pointer;border-bottom:6px solid var(--accent)}
.fc .emo{font-size:84px;width:auto}
.fc .word{font-size:34px}
.fc .hint{color:var(--muted);font-size:13px}
.fbtns{display:flex;gap:10px;justify-content:center;margin-top:14px}
.btn{border:0;background:var(--accent);color:#fff;padding:10px 18px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:var(--chip);color:var(--ink)}
.more{display:block;margin:18px auto;}
.more[hidden]{display:none}
.empty{text-align:center;color:var(--muted);padding:40px}
footer{color:var(--muted);font-size:13px;text-align:center;padding:10px 20px 30px}
@media (max-width:760px){
  header{padding:22px 16px 60px}
  .panel{margin:-44px 10px 14px;padding:12px;border-radius:16px}
  .search{flex-basis:100%}
  .row select{flex:1}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
  main{padding:0 10px 50px}
  .hide-m,.gr-col{display:none}
  table{table-layout:fixed}
  td{padding:8px 6px}
  td.emo{font-size:24px;width:38px}
  .word{font-size:16px;word-break:break-word}
  .say{width:30px;height:30px;font-size:13px}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .card{padding:12px}
  .card .emo{font-size:38px}
  .card .word{font-size:17px}
  .card .ex{font-size:13px}
  .fc{min-height:300px;padding:20px}
  .fbtns{flex-wrap:wrap}
}
@media (max-width:400px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>📚 قاموس كلمات الإنجليزي</h1>
  <p>كل كلمات منهاج <span class="en">English for Palestine</span> من الصف الخامس حتى التوجيهي، مرتّبة حسب أول صف ظهرت فيه، مع المعنى والنطق وجملة مثال.</p>
  <div class="stats" id="stats"></div>
</div></header>

<div class="panel">
  <div class="row">
    <div class="search"><span>🔍</span><input id="q" placeholder="ابحث بالإنجليزي أو بالعربي… مثال: apple أو تفاحة" autocomplete="off"></div>
    <select id="pos"><option value="">كل الأنواع</option></select>
    <div class="seg" id="view">
      <button data-v="table">📋 جدول</button>
      <button data-v="cards">🃏 بطاقات</button>
      <button data-v="flash">🔁 مراجعة</button>
    </div>
  </div>
  <div class="chips" id="grades"></div>
</div>

<main>
  <div class="result" id="result"></div>
  <div id="out"></div>
  <button class="btn alt more" id="more" hidden>عرض المزيد ⬇️</button>
</main>
<footer>اضغطي 🔊 لسماع النطق (من متصفحك). الكلمة تُنسب لأول صف ظهرت فيه، وما بتتكرر بالصفوف اللي بعده.</footer>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st={g:-1,q:'',pos:'',view:'table',shown:0,fi:0,flip:false};
const isPhone=matchMedia('(max-width:760px)').matches;st.view=isPhone?'cards':'table';

const save=()=>{try{localStorage.setItem('vocab-st',JSON.stringify({g:st.g,view:st.view,pos:st.pos}))}catch(e){}};
const PAGE=80;
let list=[];

// stats
const counts=G.map((_,i)=>D.filter(r=>r[6]===i).length);
$('#stats').innerHTML=`<div class="stat"><b>${D.length.toLocaleString('en')}</b> كلمة</div><div class="stat"><b>14</b> كتاب</div><div class="stat">من <b>5A</b> حتى <b>12</b></div>`;
// grade chips
function chips(){
  $('#grades').innerHTML=`<button class="chip ${st.g===-1?'on':''}" data-g="-1">الكل <small><bdi>${D.length}</bdi></small></button>`+
    G.map(([k,ar],i)=>`<button class="chip ${st.g===i?'on':''}" data-g="${i}" title="${ar}">${ar} <small><bdi>${counts[i]}</bdi></small></button>`).join('');
}
$('#grades').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;st.g=+b.dataset.g;chips();run()};
// pos
[...new Set(D.map(r=>r[1]))].forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;$('#pos').append(o)});
$('#pos').value=st.pos;
$('#pos').onchange=e=>{st.pos=e.target.value;run()};
// view
function setView(){document.querySelectorAll('#view button').forEach(b=>b.classList.toggle('on',b.dataset.v===st.view))}
$('#view').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.view=b.dataset.v;setView();run()};
let t;$('#q').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{st.q=e.target.value.trim().toLowerCase();run()},120)};

// speech
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.stopPropagation();say(b.dataset.say)}});

function hl(ex,w){
  const base=w.split(/[ /]/)[0].replace(/[^a-z-]/gi,'');
  const stem=base.length>4?base.slice(0,base.length-(/e$/.test(base)?1:0)):base;
  if(!stem) return esc(ex);
  const re=new RegExp('\\b('+stem.replace(/[-]/g,'\\-')+'[a-z]*)','i');
  return esc(ex).replace(re,'<mark>$1</mark>');
}
function filter(){
  const q=st.q;
  list=D.filter(r=>(st.g<0||r[6]===st.g)&&(!st.pos||r[1]===st.pos)&&(!q||r[0].toLowerCase().includes(q)||r[2].includes(q)));
  if(q) list.sort((a,b)=>(b[0].toLowerCase()===q)-(a[0].toLowerCase()===q)||(b[0].toLowerCase().startsWith(q))-(a[0].toLowerCase().startsWith(q)));
}
const sayBtn=(w)=>`<button class="say" data-say="${esc(w)}" title="استمع">🔊</button>`;
function rowHTML(r){
  return `<tr><td class="emo">${r[3]}</td>
  <td><div class="wcell">${sayBtn(r[0])}<div><div class="word en">${esc(r[0])}</div><div class="ipa en">${esc(r[4])}</div></div></div></td>
  <td class="gr-col"><span class="pos">${r[1]}</span></td>
  <td class="ar">${esc(r[2])}</td>
  <td class="ex en hide-m">${hl(r[5],r[0])} <button class="say" style="width:26px;height:26px;font-size:12px" data-say="${esc(r[5])}">▶</button></td>
  <td class="gr gr-col">${G[r[6]][1]}</td></tr>`;
}
function cardHTML(r){
  return `<div class="card"><div class="top"><span class="pos">${r[1]}</span>${sayBtn(r[0])}</div>
  <div class="emo">${r[3]}</div><div class="word en">${esc(r[0])}</div><div class="ipa en" style="text-align:center">${esc(r[4])}</div>
  <div class="ar">${esc(r[2])}</div><div class="ex en">${hl(r[5],r[0])}</div><div class="gr" style="text-align:center">${G[r[6]][1]}</div></div>`;
}
function render(append){
  const out=$('#out');
  if(!list.length){out.innerHTML='<div class="empty">ما في كلمات مطابقة 🤔</div>';$('#more').hidden=true;return}
  if(st.view==='flash'){renderFlash();$('#more').hidden=true;return}
  const from=append?st.shown:0, to=Math.min(list.length,from+PAGE);
  const html=list.slice(from,to).map(st.view==='table'?rowHTML:cardHTML).join('');
  if(!append){
    out.innerHTML=st.view==='table'
      ?`<table><thead><tr><th style="width:38px"></th><th>الكلمة</th><th class="gr-col">النوع</th><th>المعنى</th><th class="hide-m">جملة مثال</th><th class="gr-col">الصف</th></tr></thead><tbody id="tb">${html}</tbody></table>`
      :`<div class="grid" id="tb">${html}</div>`;
  } else $('#tb').insertAdjacentHTML('beforeend',html);
  st.shown=to; $('#more').hidden=to>=list.length;
}
function renderFlash(){
  const r=list[st.fi%list.length];
  $('#out').innerHTML=`<div class="flash"><div class="fc" id="fc">
    <div class="emo">${r[3]}</div><div class="word en">${esc(r[0])}</div><div class="ipa en">${esc(r[4])}</div>
    ${st.flip?`<div class="ar" style="font-size:24px;font-weight:700">${esc(r[2])}</div><span class="pos" style="align-self:center">${r[1]}</span><div class="ex en" style="text-align:center">${hl(r[5],r[0])}</div>`:'<div class="hint">اضغطي على البطاقة لتشوفي المعنى</div>'}
  </div>
  <div class="fbtns"><button class="btn alt" id="prev">→ السابقة</button>${sayBtn(r[0])}<button class="btn alt" id="shuf">🔀 خلط</button><button class="btn" id="next">التالية ←</button></div>
  <div class="result" style="margin-top:10px">${(st.fi%list.length)+1} / ${list.length}</div></div>`;
  $('#fc').onclick=()=>{st.flip=!st.flip;renderFlash()};
  $('#next').onclick=()=>{st.fi=(st.fi+1)%list.length;st.flip=false;renderFlash()};
  $('#prev').onclick=()=>{st.fi=(st.fi-1+list.length)%list.length;st.flip=false;renderFlash()};
  $('#shuf').onclick=()=>{for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}st.fi=0;st.flip=false;renderFlash()};
}
document.addEventListener('keydown',e=>{if(st.view!=='flash'||e.target.tagName==='INPUT')return;
  if(e.key===' '){e.preventDefault();st.flip=!st.flip;renderFlash()}
  if(e.key==='ArrowLeft'){st.fi=(st.fi+1)%list.length;st.flip=false;renderFlash()}
  if(e.key==='ArrowRight'){st.fi=(st.fi-1+list.length)%list.length;st.flip=false;renderFlash()}});
$('#more').onclick=()=>render(true);
new IntersectionObserver(es=>{if(es[0].isIntersecting&&!$('#more').hidden)render(true)},{rootMargin:'400px'}).observe($('#more'));
function run(){filter();st.fi=0;st.flip=false;save();
  $('#result').textContent=`${list.length.toLocaleString('en')} كلمة`+(st.g>=0?` · ${G[st.g][1]}`:'');render(false)}
chips();setView();run();
</script>
</body>
</html>
